<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Shop Eyewear | Shop Eyeglasses</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; }
  body { font-family: 'Poppins', sans-serif; background: #f8f9fa; color: #1a1a2e; }
  .app-shell { max-width: 28rem; margin: 0 auto; width: 100%; }
  @media (min-width: 1024px) { .app-shell { max-width: 960px; } }
  .icon-btn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 9999px; }
  .icon-btn:hover { background: #f4f5f7; }
  .btn-press:active { transform: scale(0.96); }
  .chip-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; -ms-overflow-style: none; scrollbar-width: none; }
  .chip-row::-webkit-scrollbar { display: none; }
  .filter-chip { flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 7px 14px; border-radius: 9999px; border: 1px solid #e5e7eb; color: #4b5563; background: #fff; white-space: nowrap; transition: all .15s ease; }
  .filter-chip.active { background: #0c1a4b; color: #fff; border-color: #0c1a4b; }
  .filter-group-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #9ca3af; letter-spacing: .04em; margin-bottom: 6px; }

/* ---- merged from static/css/style.css ---- */
/* Cart drawer (mirrors #mobileMenu behavior) */
#cartDrawer { transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.16,1,0.3,1); }
#cartDrawer.open { transform: translateX(0); }
#cartOverlay { opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }
#cartOverlay.open { opacity: 1; pointer-events: auto; }

#wishlistDrawer { transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.16,1,0.3,1); }
#wishlistDrawer.open { transform: translateX(0); }
#wishlistOverlay { opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }
#wishlistOverlay.open { opacity: 1; pointer-events: auto; }

/* Search results overlay */
#searchResultsOverlay.open { display: block; }

/* Product card (used by dynamic sections, live results, search results) */
.pc-card { display: flex; flex-direction: column; background: #fff; border-radius: 1rem; box-shadow: 0 1px 2px rgba(0,0,0,0.06); border: 1px solid #f0f1f3; overflow: hidden; transition: box-shadow .25s ease, transform .25s ease; }
.pc-card:hover { box-shadow: 0 8px 24px rgba(12,26,75,0.12); transform: translateY(-2px); }
.pc-image-wrap { position: relative; aspect-ratio: 1 / 1; background: #f4f5f7; overflow: hidden; }
.pc-image-wrap img { width: 100%; height: 100%; object-fit: cover; }
.pc-wishlist-btn { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 9999px; background: rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
.pc-wishlist-btn.active i { color: #ef4444; }
.pc-discount-badge { position: absolute; top: 8px; left: 8px; background: #0c1a4b; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 9999px; }
.pc-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.pc-brand { font-size: 11px; color: #6b7280; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.pc-name { font-size: 13px; font-weight: 600; color: #0c1a4b; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pc-price-row { display: flex; align-items: baseline; gap: 6px; margin-top: 2px; }
.pc-price { font-weight: 700; color: #0c1a4b; font-size: 14px; }
.pc-price-strike { font-size: 12px; color: #9ca3af; text-decoration: line-through; }
.pc-stock-out { font-size: 11px; color: #dc2626; font-weight: 600; }
.pc-add-btn { margin-top: 6px; width: 100%; background: #0c1a4b; color: #fff; font-size: 12px; font-weight: 700; padding: 8px 0; border-radius: 8px; transition: background-color .2s ease; }
.pc-add-btn:hover { background: #132363; }
.pc-add-btn:disabled { background: #d1d5db; cursor: not-allowed; }

/* Cart line item */
.cart-line { display: flex; gap: 10px; align-items: center; border: 1px solid #f0f1f3; border-radius: 12px; padding: 8px; }
.cart-line img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; background: #f4f5f7; flex-shrink: 0; }
.cart-qty-btn { width: 26px; height: 26px; border-radius: 9999px; border: 1px solid #d1d5db; display: flex; align-items: center; justify-content: center; font-weight: 700; }

/* Prescription form */
.rx-input { border: 1px solid #d1d5db; border-radius: 8px; padding: 8px 10px; font-size: 13px; width: 100%; }
.rx-input:focus { outline: 2px solid #2563eb; outline-offset: 1px; border-color: transparent; }

/* Simple section spinner */
.spinner { width: 28px; height: 28px; border: 3px solid #e5e7eb; border-top-color: #0c1a4b; border-radius: 9999px; animation: spin .7s linear infinite; margin: 24px auto; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  .pc-card, .pc-card:hover, #cartDrawer, #cartOverlay { transition: none !important; transform: none !important; }
}


</style>
</head>
<body class="antialiased">

<!-- Cart drawer -->
<div id="cartOverlay" class="fixed inset-0 bg-black/50 z-[80]" onclick="closeCart()"></div>
<aside id="cartDrawer" class="fixed top-0 right-0 h-full w-[88%] max-w-sm bg-white z-[90] shadow-2xl overflow-y-auto">
  <div class="flex items-center justify-between px-5 py-4 border-b">
    <span class="font-bold text-lg text-[#0c1a4b]">Your Bag</span>
    <button class="icon-btn text-gray-600 hover:text-black btn-press" onclick="closeCart()" aria-label="Close cart"><i class="fa-solid fa-xmark text-xl"></i></button>
  </div>
  <div id="cartItemsList" class="p-4 flex flex-col gap-3"></div>
  <div id="cartFooter" class="p-4 border-t hidden">
    <div class="flex justify-between font-bold text-[#0c1a4b] mb-3">
      <span>Total</span><span id="cartTotal">₹0</span>
    </div>
    <a href="#" id="cartCheckoutBtn" class="btn-press block text-center w-full bg-[#0c1a4b] text-white font-bold py-3 rounded-lg hover:bg-[#132363] transition-colors">Checkout</a>
  </div>
</aside>

<!-- Wishlist drawer -->
<div id="wishlistOverlay" class="fixed inset-0 bg-black/50 z-[80]" onclick="closeWishlistView()"></div>
<aside id="wishlistDrawer" class="fixed top-0 right-0 h-full w-[88%] max-w-sm bg-white z-[90] shadow-2xl overflow-y-auto">
  <div class="flex items-center justify-between px-5 py-4 border-b">
    <span class="font-bold text-lg text-[#0c1a4b]">Your Wishlist</span>
    <button class="icon-btn text-gray-600 hover:text-black btn-press" onclick="closeWishlistView()" aria-label="Close wishlist"><i class="fa-solid fa-xmark text-xl"></i></button>
  </div>
  <div id="wishlistItemsList" class="p-4 grid grid-cols-2 gap-3"></div>
</aside>

<!-- Search results overlay -->
<div id="searchResultsOverlay" class="fixed inset-0 bg-black/50 z-[80] hidden" onclick="closeSearchResults(event)">
  <div class="bg-white mt-16 mx-auto app-shell rounded-t-2xl lg:rounded-2xl max-h-[80vh] overflow-y-auto" onclick="event.stopPropagation()">
    <div class="flex items-center justify-between px-5 py-4 border-b sticky top-0 bg-white">
      <span class="font-bold text-lg text-[#0c1a4b]">Search Results</span>
      <button class="icon-btn text-gray-600 hover:text-black btn-press" onclick="closeSearchResults()"><i class="fa-solid fa-xmark text-xl"></i></button>
    </div>
    <div id="searchResultsGrid" class="grid grid-cols-2 lg:grid-cols-4 gap-4 p-4"></div>
  </div>
</div>

<header class="sticky top-0 z-30 bg-white shadow-sm border-b">
  <div class="app-shell px-4 py-3 flex items-center gap-3">
    <a href="/" class="icon-btn text-gray-700 hover:text-black flex-shrink-0"><i class="fa-solid fa-arrow-left text-xl"></i></a>
    <h1 id="pageTitle" class="text-base font-bold truncate flex-1">Shop Eyewear</h1>
    <div class="flex items-center gap-1 flex-shrink-0">
      <button class="icon-btn text-gray-700 hover:text-black btn-press" onclick="openShopSearch()" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
      <button id="wishlistBtn" class="icon-btn text-gray-700 hover:text-black btn-press relative" aria-label="Wishlist" onclick="openWishlistView()">
        <i class="fa-regular fa-heart"></i>
        <span id="wishlistCount" class="hidden absolute top-1 right-1 bg-red-500 text-white text-[9px] font-bold rounded-full w-4 h-4 items-center justify-center">0</span>
      </button>
      <button id="bagBtn" class="icon-btn text-gray-700 hover:text-black btn-press relative" aria-label="Shopping bag" onclick="openCart()">
        <i class="fa-solid fa-bag-shopping"></i>
        <span id="bagCount" class="hidden absolute top-1 right-1 bg-blue-600 text-white text-[9px] font-bold rounded-full w-4 h-4 items-center justify-center">0</span>
      </button>
      <a href="/login" id="desktopAuthArea" class="hidden lg:inline-flex btn-press text-xs font-bold bg-[#0c1a4b] text-white px-3 py-2 rounded-lg hover:bg-[#132363] transition-colors ml-1">Login</a>
    </div>
  </div>
  <div id="shopSearchBar" class="app-shell px-4 pb-3 hidden">
    <div class="relative">
      <input id="searchInput" type="text" placeholder="Search glasses, brands, SKU..." class="w-full bg-gray-100 rounded-lg pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#0c1a4b]" onkeydown="if(event.key==='Enter') window.runSearch()"/>
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
    </div>
  </div>
</header>

<main class="app-shell px-4 pb-16 pt-4">
  <div id="filterBar" class="mb-4 space-y-3">
    <div>
      <p class="filter-group-label">Shopping for</p>
      <div class="chip-row" id="genderChips"></div>
    </div>
    <div>
      <p class="filter-group-label">Type</p>
      <div class="chip-row" id="typeChips"></div>
    </div>
    <div>
      <p class="filter-group-label">Shape</p>
      <div class="chip-row" id="shapeChips"></div>
    </div>
    <div>
      <p class="filter-group-label">Price</p>
      <div class="chip-row" id="priceChips"></div>
    </div>
    <button id="clearFiltersBtn" class="hidden text-xs font-semibold text-blue-600 btn-press" onclick="clearAllFilters()"><i class="fa-solid fa-xmark mr-1"></i>Clear all filters</button>
  </div>

  <p id="resultCount" class="text-xs text-gray-500 mb-3"></p>
  <div id="shopGrid" class="grid grid-cols-2 lg:grid-cols-4 gap-4"></div>
  <div id="shopSpinner" class="hidden"><div class="spinner"></div></div>
  <p id="shopEmpty" class="hidden text-center text-gray-500 py-16">No glasses found for these filters.<br/><button class="text-blue-600 font-semibold mt-2 btn-press" onclick="clearAllFilters()">Clear filters</button></p>
</main>

<script>window.STORE_CONFIG = { googleClientId: "{{ google_client_id }}", whatsappNumber: "{{ whatsapp_number }}" };</script>
<script>
/* ---- merged from static/js/app.js ---- */
/* global window, document */
(function () {
  "use strict";

  const CFG = window.STORE_CONFIG || {};
  let currentUser = null;
  let wishlistIds = new Set();

  // -------------------------------------------------------------------
  // Small fetch helper
  // -------------------------------------------------------------------
  async function api(path, opts) {
    const res = await fetch(path, Object.assign({
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
    }, opts));
    let data = {};
    try { data = await res.json(); } catch (e) { /* no body */ }
    if (!res.ok) {
      const err = new Error(data.error || "Request failed");
      err.status = res.status;
      err.data = data;
      throw err;
    }
    return data;
  }

  function rupee(n) {
    return "₹" + Math.round(n).toLocaleString("en-IN");
  }

  function toast(msg) {
    if (typeof window.showToast === "function") window.showToast(msg);
  }

  // -------------------------------------------------------------------
  // Auth
  // -------------------------------------------------------------------
  window.handleGoogleCredential = async function (response) {
    try {
      const data = await api("/api/auth/google", {
        method: "POST",
        body: JSON.stringify({ credential: response.credential }),
      });
      currentUser = data.user;
      toast(`Welcome, ${currentUser.name || currentUser.email}!`);
      renderAuthArea();
      refreshWishlistState();
      refreshCartBadge();
      const redirect = sessionStorage.getItem("post_login_redirect");
      if (redirect) {
        sessionStorage.removeItem("post_login_redirect");
        window.location.href = redirect;
      }
    } catch (e) {
      toast("Google sign-in failed. Please try again.");
    }
  };

  async function loadCurrentUser() {
    try {
      const data = await api("/api/auth/me");
      currentUser = data.user;
    } catch (e) {
      currentUser = null;
    }
    renderAuthArea();
  }

  async function logout() {
    await api("/api/auth/logout", { method: "POST" });
    currentUser = null;
    wishlistIds = new Set();
    renderAuthArea();
    updateWishlistBadge();
    toast("Logged out");
  }
  window.logout = logout;

  function renderAuthArea() {
    const desktop = document.getElementById("desktopAuthArea");
    const mobile = document.getElementById("mobileAuthArea");
    if (!desktop && !mobile) return;

    if (currentUser) {
      const label = (currentUser.name || currentUser.email || "Account").split(" ")[0];
      if (desktop) {
        desktop.outerHTML = `<button id="desktopAuthArea" onclick="window.logout()" class="btn-press text-sm font-bold bg-[#0c1a4b] text-white px-4 py-2 rounded-lg hover:bg-[#132363] transition-colors flex items-center gap-2">
          ${currentUser.profile_image ? `<img src="${currentUser.profile_image}" class="w-5 h-5 rounded-full" alt=""/>` : ""}
          Hi, ${label} <i class="fa-solid fa-right-from-bracket text-xs"></i>
        </button>`;
      }
      if (mobile) {
        mobile.innerHTML = `<div class="flex items-center gap-2 mb-3">
            ${currentUser.profile_image ? `<img src="${currentUser.profile_image}" class="w-8 h-8 rounded-full" alt=""/>` : ""}
            <span class="font-semibold text-[#0c1a4b]">${currentUser.name || currentUser.email}</span>
          </div>
          <button onclick="window.logout()" class="btn-press w-full bg-gray-100 text-[#0c1a4b] font-bold py-3 rounded-lg">Logout</button>`;
        if (currentUser.role === "admin") {
          mobile.innerHTML += `<a href="/admin" class="btn-press block text-center mt-2 w-full bg-[#0c1a4b] text-white font-bold py-3 rounded-lg">Admin Dashboard</a>`;
        }
      }
    } else {
      if (desktop) {
        desktop.outerHTML = `<a href="/login" id="desktopAuthArea" class="btn-press text-sm font-bold bg-[#0c1a4b] text-white px-4 py-2 rounded-lg hover:bg-[#132363] transition-colors">Login</a>`;
      }
      if (mobile) {
        mobile.innerHTML = `<a href="/login" class="btn-press w-full bg-[#0c1a4b] text-white font-bold py-3 rounded-lg hover:bg-[#132363] transition-colors flex items-center justify-center">
          <i class="fa-solid fa-user mr-2"></i>Login / Sign Up</a>`;
      }
    }
  }

  function requireLogin(redirectTarget) {
    sessionStorage.setItem("post_login_redirect", redirectTarget || window.location.pathname);
    window.location.href = "/login";
  }
  window.requireLogin = requireLogin;

  // -------------------------------------------------------------------
  // Product card rendering (shared by dynamic sections / search / filters)
  // -------------------------------------------------------------------
  function productCardHtml(p) {
    const hasDiscount = p.sale_price && p.sale_price < p.price;
    const wished = wishlistIds.has(p.id);
    return `
    <div class="pc-card">
      <a href="/product/${p.id}" class="pc-image-wrap block">
        ${hasDiscount ? `<span class="pc-discount-badge">${p.discount_pct}% OFF</span>` : ""}
        <img src="${p.image || 'https://placehold.co/400x400?text=Eyewear'}" alt="${escapeHtml(p.name)}" loading="lazy"/>
      </a>
      <button class="pc-wishlist-btn ${wished ? "active" : ""}" aria-label="Toggle wishlist" onclick="window.toggleWishlistProduct(${p.id}, this)">
        <i class="fa-${wished ? "solid" : "regular"} fa-heart text-sm"></i>
      </button>
      <div class="pc-body">
        <span class="pc-brand">${escapeHtml(p.brand || "")}</span>
        <a href="/product/${p.id}" class="pc-name">${escapeHtml(p.name)}</a>
        <div class="pc-price-row">
          <span class="pc-price">${rupee(p.effective_price)}</span>
          ${hasDiscount ? `<span class="pc-price-strike">${rupee(p.price)}</span>` : ""}
        </div>
        ${p.in_stock
          ? `<button class="pc-add-btn" onclick="window.addToCart(${p.id}, this)">Add to Bag</button>`
          : `<span class="pc-stock-out">Out of stock</span>`}
      </div>
    </div>`;
  }
  window.__productCardHtml = productCardHtml;

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  // -------------------------------------------------------------------
  // Dynamic homepage sections (CMS)
  // -------------------------------------------------------------------
  async function loadDynamicSections() {
    const container = document.getElementById("dynamicSections");
    if (!container) return;
    try {
      const data = await api("/api/sections");
      container.innerHTML = data.sections.map((s) => `
        <section class="py-4 px-4 io-reveal in-view">
          <div class="flex items-center justify-between mb-4">
            <div>
              <h3 class="text-xl font-bold text-[#0c1a4b]">${escapeHtml(s.title)}</h3>
              ${s.subtitle ? `<p class="text-sm text-gray-500">${escapeHtml(s.subtitle)}</p>` : ""}
            </div>
            ${s.button_text ? `<button class="text-sm font-semibold text-blue-600 btn-press" onclick="scrollToShop()">${escapeHtml(s.button_text)}</button>` : ""}
          </div>
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            ${s.products.length ? s.products.map(productCardHtml).join("") : `<p class="col-span-full text-center text-gray-400 py-6">No products in this section yet.</p>`}
          </div>
        </section>`).join("");
    } catch (e) {
      container.innerHTML = "";
    }
  }

  // -------------------------------------------------------------------
  // Hero slider — rebuilt from CMS data when the admin has added slides
  // -------------------------------------------------------------------
  async function loadHeroSlides() {
    try {
      const data = await api("/api/hero-slides");
      if (!data.slides || data.slides.length === 0) return; // keep the built-in design
      rebuildHero(data.slides);
    } catch (e) { /* keep default hero */ }
  }

  function rebuildHero(slides) {
    const section = document.getElementById("heroSlider");
    if (!section) return;
    const slidesHtml = slides.map((s, i) => `
      <article class="hero-slide${i === 0 ? " active" : ""}" data-slide="${i}" data-tone="${s.tone || "dark"}">
        <div class="hero-media-wrap">
          ${s.video
            ? `<video class="hero-media object-cover" data-slide-video muted loop playsinline preload="none"><source src="${s.video}" type="video/mp4"/></video>`
            : `<img alt="${escapeHtml(s.heading)}" class="hero-media object-cover" src="${s.image || 'https://placehold.co/1600x800'}"/>`}
        </div>
        <div class="hero-scrim hero-scrim-amber"></div>
        <div class="hero-content w-[85%] lg:w-1/2 items-start text-left">
          <h2 class="hero-h text-2xl lg:text-5xl font-bold leading-tight mb-2 text-white">${escapeHtml(s.heading)}</h2>
          ${s.subtitle ? `<p class="hero-p text-sm lg:text-lg text-white/80 font-medium mb-4">${escapeHtml(s.subtitle)}</p>` : ""}
          ${s.button_text ? `<a href="${s.button_link || '#'}" class="hero-cta btn-press inline-flex w-fit items-center gap-2 bg-white text-[#0c1a4b] font-bold px-5 py-2.5 lg:px-6 lg:py-3 rounded-lg hover:bg-amber-50 transition-colors">${escapeHtml(s.button_text)} <i class="fa-solid fa-arrow-right"></i></a>` : ""}
        </div>
      </article>`).join("");

    const dotsHtml = slides.map((s, i) => `
      <div class="hero-dot h-1 bg-white flex-1 rounded-full ${i === 0 ? "opacity-100" : "opacity-40"}" data-slide="${i}" onclick="window.__heroSetSlide(${i})"><span class="hero-dot-fill"></span></div>`).join("");

    section.innerHTML = `
      ${slidesHtml}
      <button class="hero-nav hero-nav-prev" onclick="window.__heroShift(-1)" aria-label="Previous slide"><i class="fa-solid fa-chevron-left"></i></button>
      <button class="hero-nav hero-nav-next" onclick="window.__heroShift(1)" aria-label="Next slide"><i class="fa-solid fa-chevron-right"></i></button>
      <div class="absolute bottom-4 left-4 right-4 lg:left-8 lg:right-8 z-20 flex gap-2">${dotsHtml}</div>`;

    let idx = 0, timer = null;
    const nodes = () => section.querySelectorAll(".hero-slide");
    const dots = () => section.querySelectorAll(".hero-dot");
    function setSlide(i) {
      const list = nodes();
      idx = (i + list.length) % list.length;
      list.forEach((el, n) => el.classList.toggle("active", n === idx));
      dots().forEach((d, n) => { d.style.opacity = n === idx ? "1" : "0.4"; });
    }
    function restart() {
      clearInterval(timer);
      timer = setInterval(() => setSlide(idx + 1), 4000);
    }
    window.__heroSetSlide = (i) => { setSlide(i); restart(); };
    window.__heroShift = (d) => { setSlide(idx + d); restart(); };
    restart();
  }

  // -------------------------------------------------------------------
  // Search
  // -------------------------------------------------------------------
  window.runSearch = async function () {
    const input = document.getElementById("searchInput");
    const val = (input && input.value || "").trim();
    if (!val) { toast("Type something to search"); return; }
    try {
      const data = await api(`/api/products?search=${encodeURIComponent(val)}`);
      showSearchResults(val, data.products);
    } catch (e) {
      toast("Search failed, please try again");
    }
  };

  function showSearchResults(term, products) {
    const overlay = document.getElementById("searchResultsOverlay");
    const grid = document.getElementById("searchResultsGrid");
    if (!overlay || !grid) return;
    grid.innerHTML = products.length
      ? products.map(productCardHtml).join("")
      : `<p class="col-span-full text-center text-gray-500 py-10">No glasses found for "${escapeHtml(term)}".</p>`;
    overlay.classList.remove("hidden");
  }
  window.closeSearchResults = function (e) {
    if (e && e.target !== e.currentTarget) return;
    document.getElementById("searchResultsOverlay").classList.add("hidden");
  };

  // -------------------------------------------------------------------
  // Live filtered results (gender / shape / style / price)
  // -------------------------------------------------------------------
  async function showLiveResults(title, params) {
    const section = document.getElementById("liveResults");
    const grid = document.getElementById("liveResultsGrid");
    const empty = document.getElementById("liveResultsEmpty");
    const heading = document.getElementById("liveResultsTitle");
    if (!section) return;
    heading.textContent = title;
    section.classList.remove("hidden");
    grid.innerHTML = `<div class="col-span-full"><div class="spinner"></div></div>`;
    empty.classList.add("hidden");
    try {
      const qs = new URLSearchParams(params).toString();
      const data = await api(`/api/products?${qs}`);
      if (data.products.length === 0) {
        grid.innerHTML = "";
        empty.classList.remove("hidden");
      } else {
        grid.innerHTML = data.products.map(productCardHtml).join("");
      }
    } catch (e) {
      grid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-10">Something went wrong loading results.</p>`;
    }
    section.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  window.clearLiveResults = function () {
    document.getElementById("liveResults").classList.add("hidden");
  };

  window.selectCategory = function (name, el) {
    document.querySelectorAll("#shopping-for button").forEach((b) => b.querySelector("div").classList.remove("ring-2", "ring-blue-600"));
    if (el) el.querySelector("div").classList.add("ring-2", "ring-blue-600");
    showLiveResults(`Eyewear for ${name}`, { gender: name });
  };

  window.filterByPrice = function (band) {
    const labels = { "under-750": "Under ₹750", "750-1500": "₹750 – ₹1,500", "1500-3000": "₹1,500 – ₹3,000", "3000-plus": "₹3,000+" };
    showLiveResults(labels[band] || "Results", { price_band: band });
  };

  window.filterByShape = function (shape) {
    showLiveResults(`${shape} Frames`, { shape });
  };

  window.filterByStyle = function (style) {
    showLiveResults(`${style} Looks`, { style });
  };

  window.scrollToShop = function (gender) {
    if (gender) { window.selectCategory(gender); return; }
    const target = document.getElementById("dynamicSections") || document.getElementById("shop-by-price");
    if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  // -------------------------------------------------------------------
  // Wishlist
  // -------------------------------------------------------------------
  async function refreshWishlistState() {
    if (!currentUser) { wishlistIds = new Set(); updateWishlistBadge(); return; }
    try {
      const data = await api("/api/wishlist");
      wishlistIds = new Set(data.items.map((i) => i.product.id));
    } catch (e) { wishlistIds = new Set(); }
    updateWishlistBadge();
    document.dispatchEvent(new CustomEvent("wishlist:ready"));
  }
  window.isWishlisted = (id) => wishlistIds.has(id);

  function updateWishlistBadge() {
    const countEl = document.getElementById("wishlistCount");
    if (!countEl) return;
    if (wishlistIds.size > 0) {
      countEl.textContent = wishlistIds.size;
      countEl.classList.remove("hidden");
      countEl.classList.add("flex");
    } else {
      countEl.classList.add("hidden");
      countEl.classList.remove("flex");
    }
  }

  window.toggleWishlistProduct = async function (productId, btnEl) {
    if (!currentUser) { requireLogin(); return; }
    try {
      const data = await api("/api/wishlist/toggle", {
        method: "POST", body: JSON.stringify({ product_id: productId }),
      });
      if (data.wishlisted) wishlistIds.add(productId); else wishlistIds.delete(productId);
      updateWishlistBadge();
      if (btnEl) {
        const icon = btnEl.querySelector("i");
        btnEl.classList.toggle("active", data.wishlisted);
        icon.className = `fa-${data.wishlisted ? "solid" : "regular"} fa-heart text-sm`;
      }
      toast(data.wishlisted ? "Added to wishlist" : "Removed from wishlist");
      if (document.getElementById("wishlistDrawer").classList.contains("open")) renderWishlistDrawer();
    } catch (e) {
      toast("Could not update wishlist");
    }
  };

  window.openWishlistView = async function () {
    if (!currentUser) { requireLogin(); return; }
    await renderWishlistDrawer();
    document.getElementById("wishlistDrawer").classList.add("open");
    document.getElementById("wishlistOverlay").classList.add("open");
    document.body.style.overflow = "hidden";
  };
  window.closeWishlistView = function () {
    document.getElementById("wishlistDrawer").classList.remove("open");
    document.getElementById("wishlistOverlay").classList.remove("open");
    document.body.style.overflow = "";
  };

  async function renderWishlistDrawer() {
    const list = document.getElementById("wishlistItemsList");
    try {
      const data = await api("/api/wishlist");
      list.innerHTML = data.items.length
        ? data.items.map((i) => productCardHtml(i.product)).join("")
        : `<p class="col-span-2 text-center text-gray-500 py-10">Your wishlist is empty.</p>`;
    } catch (e) {
      list.innerHTML = `<p class="col-span-2 text-center text-gray-500 py-10">Could not load wishlist.</p>`;
    }
  }

  // -------------------------------------------------------------------
  // Cart
  // -------------------------------------------------------------------
  async function refreshCartBadge() {
    try {
      const data = await api("/api/cart");
      const countEl = document.getElementById("bagCount");
      const count = data.items.reduce((n, i) => n + i.quantity, 0);
      if (count > 0) {
        countEl.textContent = count;
        countEl.classList.remove("hidden");
        countEl.classList.add("flex");
      } else {
        countEl.classList.add("hidden");
        countEl.classList.remove("flex");
      }
    } catch (e) { /* ignore */ }
  }

  window.addToCart = async function (productId, btnEl) {
    try {
      await api("/api/cart/add", { method: "POST", body: JSON.stringify({ product_id: productId, quantity: 1 }) });
      toast("Item added to bag");
      refreshCartBadge();
      if (document.getElementById("cartDrawer").classList.contains("open")) renderCartDrawer();
    } catch (e) {
      toast(e.data && e.data.error ? e.data.error : "Could not add to bag");
    }
  };

  window.openCart = async function () {
    await renderCartDrawer();
    document.getElementById("cartDrawer").classList.add("open");
    document.getElementById("cartOverlay").classList.add("open");
    document.body.style.overflow = "hidden";
  };
  window.closeCart = function () {
    document.getElementById("cartDrawer").classList.remove("open");
    document.getElementById("cartOverlay").classList.remove("open");
    document.body.style.overflow = "";
  };

  async function renderCartDrawer() {
    const list = document.getElementById("cartItemsList");
    const footer = document.getElementById("cartFooter");
    try {
      const data = await api("/api/cart");
      if (data.items.length === 0) {
        list.innerHTML = `<p class="text-center text-gray-500 py-10">Your bag is empty.</p>`;
        footer.classList.add("hidden");
        return;
      }
      list.innerHTML = data.items.map((i) => `
        <div class="cart-line" data-item-id="${i.id}">
          <img src="${i.product.image || 'https://placehold.co/100'}" alt=""/>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold text-[#0c1a4b] truncate">${escapeHtml(i.product.name)}</p>
            <p class="text-xs text-gray-500">${rupee(i.product.effective_price)} each</p>
            <div class="flex items-center gap-2 mt-1">
              <button class="cart-qty-btn" onclick="window.updateCartQty(${i.id}, ${i.quantity - 1})">−</button>
              <span class="text-sm w-5 text-center">${i.quantity}</span>
              <button class="cart-qty-btn" onclick="window.updateCartQty(${i.id}, ${i.quantity + 1})">+</button>
            </div>
          </div>
          <button class="text-gray-400 hover:text-red-500 px-1" onclick="window.removeCartItem(${i.id})"><i class="fa-solid fa-trash"></i></button>
        </div>`).join("");
      document.getElementById("cartTotal").textContent = rupee(data.total);
      footer.classList.remove("hidden");

      const checkoutBtn = document.getElementById("cartCheckoutBtn");
      const firstItem = data.items[0];
      checkoutBtn.onclick = (e) => {
        e.preventDefault();
        if (!currentUser) { requireLogin(`/product/${firstItem.product.id}`); return; }
        window.location.href = `/product/${firstItem.product.id}`;
      };
    } catch (e) {
      list.innerHTML = `<p class="text-center text-gray-500 py-10">Could not load your bag.</p>`;
    }
  }

  window.updateCartQty = async function (itemId, qty) {
    try {
      await api("/api/cart/update", { method: "POST", body: JSON.stringify({ item_id: itemId, quantity: qty }) });
      renderCartDrawer();
      refreshCartBadge();
    } catch (e) { toast("Could not update quantity"); }
  };
  window.removeCartItem = async function (itemId) {
    try {
      await api("/api/cart/remove", { method: "POST", body: JSON.stringify({ item_id: itemId }) });
      renderCartDrawer();
      refreshCartBadge();
    } catch (e) { toast("Could not remove item"); }
  };

  // -------------------------------------------------------------------
  // WhatsApp support (footer "Chat With Us")
  // -------------------------------------------------------------------
  window.openWhatsAppSupport = function () {
    const msg = encodeURIComponent("Hello, I have a question about your eyewear.");
    window.open(`https://wa.me/${CFG.whatsappNumber}?text=${msg}`, "_blank");
  };

  // -------------------------------------------------------------------
  // Footer CMS content
  // -------------------------------------------------------------------
  async function loadFooterConfig() {
    try {
      const data = await api("/api/site-config/footer");
      const cfg = data.value;
      if (!cfg || Object.keys(cfg).length === 0) return;
      const aboutEl = document.getElementById("footerAboutLinks");
      if (aboutEl && cfg.about_links) {
        aboutEl.innerHTML = cfg.about_links.map((l) =>
          `<a href="${l.url || '#'}" class="block hover:text-white transition-colors">${escapeHtml(l.label)}</a>`).join("");
      }
      const copyEl = document.getElementById("footerCopyright");
      if (copyEl && cfg.copyright) copyEl.textContent = cfg.copyright;
    } catch (e) { /* keep defaults */ }
  }

  // -------------------------------------------------------------------
  // Init
  // -------------------------------------------------------------------
  document.addEventListener("DOMContentLoaded", async () => {
    await loadCurrentUser();
    refreshWishlistState();
    refreshCartBadge();
    loadDynamicSections();
    loadHeroSlides();
    loadFooterConfig();

    if (window.google && window.google.accounts && CFG.googleClientId) {
      // Header/menu use links to /login for the full-screen sign-in experience;
      // this just keeps GSI's session state fresh if a One Tap prompt is desired later.
    }
  });
})();

</script>
<script>
  // ---------------------------------------------------------------------
  // Category page filter logic (gender / type / shape / price via URL params)
  // ---------------------------------------------------------------------
  const GENDER_OPTS = ["Men", "Women", "Kids", "Teenagers"];
  const TYPE_OPTS = ["Eyeglasses", "Sunglasses", "Blue-light glasses", "Reading glasses", "Computer glasses", "Prescription glasses"];
  const SHAPE_OPTS = ["Round", "Square", "Rectangle", "Oval", "Cat Eye", "Geometric", "Aviator"];
  const PRICE_OPTS = [
    { value: "under-750", label: "Under ₹750" },
    { value: "750-1500", label: "₹750 – ₹1,500" },
    { value: "1500-3000", label: "₹1,500 – ₹3,000" },
    { value: "3000-plus", label: "₹3,000+" },
  ];

  function currentParams() {
    return new URLSearchParams(window.location.search);
  }

  function setFilter(key, value) {
    const params = currentParams();
    const active = params.get(key) === value;
    if (active) {
      params.delete(key);
    } else {
      params.set(key, value);
    }
    window.location.href = "/shop" + (params.toString() ? "?" + params.toString() : "");
  }

  function clearAllFilters() {
    window.location.href = "/shop";
  }

  function openShopSearch() {
    const bar = document.getElementById("shopSearchBar");
    bar.classList.toggle("hidden");
    if (!bar.classList.contains("hidden")) document.getElementById("searchInput").focus();
  }

  function renderChips(containerId, options, paramKey, valueOf, labelOf) {
    const el = document.getElementById(containerId);
    const params = currentParams();
    const activeVal = params.get(paramKey);
    el.innerHTML = options.map((o) => {
      const val = valueOf(o), label = labelOf(o);
      const isActive = activeVal === val;
      return `<button class="filter-chip ${isActive ? "active" : ""}" onclick="setFilter('${paramKey}', '${val}')">${label}</button>`;
    }).join("");
  }

  function buildTitle(params) {
    const search = params.get("search");
    if (search) return `Search: "${search}"`;
    const gender = params.get("gender");
    const shape = params.get("shape");
    const type = params.get("type");
    const priceBand = params.get("price_band");
    const parts = [];
    if (gender) parts.push(`${gender}'s`);
    if (shape) parts.push(shape);
    if (type) parts.push(type);
    else if (parts.length === 0) parts.push("All Eyewear");
    let title = parts.join(" ") || "Shop Eyewear";
    if (priceBand) {
      const band = PRICE_OPTS.find((p) => p.value === priceBand);
      if (band) title += ` — ${band.label}`;
    }
    return title;
  }

  async function loadShopGrid() {
    const params = currentParams();
    document.getElementById("pageTitle").textContent = buildTitle(params);
    document.title = buildTitle(params) + " | Shop Eyeglasses";

    const hasFilters = ["gender", "shape", "type", "price_band", "search", "tag", "tags", "brand"].some((k) => params.get(k));
    document.getElementById("clearFiltersBtn").classList.toggle("hidden", !hasFilters);

    renderChips("genderChips", ["All", ...GENDER_OPTS], "gender", (o) => (o === "All" ? "" : o), (o) => o);
    renderChips("typeChips", ["All", ...TYPE_OPTS], "type", (o) => (o === "All" ? "" : o), (o) => o);
    renderChips("shapeChips", ["All", ...SHAPE_OPTS], "shape", (o) => (o === "All" ? "" : o), (o) => o);
    renderChips("priceChips", [{ value: "", label: "All" }, ...PRICE_OPTS], "price_band", (o) => o.value, (o) => o.label);
    // "All" chips clear that dimension entirely rather than toggling an empty value
    document.querySelectorAll('#genderChips .filter-chip, #typeChips .filter-chip, #shapeChips .filter-chip').forEach((btn, i, arr) => {});

    const grid = document.getElementById("shopGrid");
    const spinner = document.getElementById("shopSpinner");
    const empty = document.getElementById("shopEmpty");
    const countEl = document.getElementById("resultCount");

    grid.innerHTML = "";
    empty.classList.add("hidden");
    spinner.classList.remove("hidden");
    countEl.textContent = "";

    try {
      const res = await fetch("/api/products?" + params.toString(), { credentials: "same-origin" });
      const data = await res.json();
      spinner.classList.add("hidden");
      if (!data.products || data.products.length === 0) {
        empty.classList.remove("hidden");
        return;
      }
      countEl.textContent = `${data.count} glasses found`;
      grid.innerHTML = data.products.map(window.__productCardHtml).join("");
    } catch (e) {
      spinner.classList.add("hidden");
      countEl.textContent = "";
      grid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-16">Something went wrong loading products.</p>`;
    }
  }

  // Prefill the search box if arriving via /shop?search=...
  window.addEventListener("DOMContentLoaded", () => {
    const params = currentParams();
    const search = params.get("search");
    if (search) {
      document.getElementById("searchInput").value = search;
      document.getElementById("shopSearchBar").classList.remove("hidden");
    }
    loadShopGrid();
  });

  // Override runSearch (defined in app.js) to navigate this page's own
  // results grid instead of opening the overlay, since we're already on
  // a listing page.
  window.runSearch = function () {
    const val = (document.getElementById("searchInput").value || "").trim();
    const params = currentParams();
    if (val) params.set("search", val); else params.delete("search");
    window.location.href = "/shop" + (params.toString() ? "?" + params.toString() : "");
  };
</script>
</body>
</html>
